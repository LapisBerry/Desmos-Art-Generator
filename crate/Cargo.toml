[package]
name = "desmos-art-generator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
vtracer = "0.6"
roxmltree = "0.19"
svgtypes = "0.13"
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
